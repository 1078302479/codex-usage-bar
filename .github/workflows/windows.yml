name: Windows checks
on:
  push:
    branches: [windows]
  pull_request:
    branches: [windows]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm --dir windows install --frozen-lockfile
      - run: pnpm --dir windows test
      - name: PowerShell syntax
        shell: pwsh
        run: |
          Get-ChildItem windows -Filter *.ps1 -Recurse -File | ForEach-Object {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($_.FullName, [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count) { throw ($errors -join "`n") }
          }
